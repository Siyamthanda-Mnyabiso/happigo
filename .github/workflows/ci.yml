name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Unit tests plus database tests: in-memory Postgres (PGlite) runs the real migrations,
      # proves the row level security rules, and checks the types match the SQL.
      - run: npm test
      # Placeholder values: enough to prerender, never used to reach a real project.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  mobile:
    name: Mobile typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # The shared native code in ../native-shared resolves react and friends from this app's node_modules.
      - run: ln -s "$PWD/node_modules" ../native-shared/node_modules
      # The web app's pure logic (money, pricing, cart rules) is imported from ../src/lib,
      # so it is checked here too, against the mobile app's own dependencies.
      - run: npm run typecheck
      - run: npm run lint

  driver:
    name: Driver app typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: driver/package-lock.json
      - run: npm ci
      # The shared native code in ../native-shared resolves react and friends from this app's node_modules.
      - run: ln -s "$PWD/node_modules" ../native-shared/node_modules
      # Shared web logic (../src/lib) and shared native code (../native-shared) are checked here too.
      - run: npm run typecheck
      - run: npm run lint

  restaurant:
    name: Restaurant app typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: restaurant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: restaurant/package-lock.json
      - run: npm ci
      # The shared native code in ../native-shared resolves react and friends from this app's node_modules.
      - run: ln -s "$PWD/node_modules" ../native-shared/node_modules
      # Shared web logic (../src/lib) and shared native code (../native-shared) are checked here too.
      - run: npm run typecheck
      - run: npm run lint
